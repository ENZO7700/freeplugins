
name: Deploy to Firebase

on:
  push:
    branches:
      - main

jobs:
  test_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Firebase Emulators
        run: firebase setup:emulators:firestore

      - name: Test Firebase Security Rules
        run: firebase emulators:exec "npm test" --only firestore 
        # Note: This assumes you have tests configured in package.json's "test" script
        # A proper setup would require a test runner like Jest and test files.

      - name: Deploy to Firebase Hosting & Functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          # The FIREBASE_TOKEN needs to be set in your GitHub repository secrets
          # This will deploy hosting, functions, and firestore rules/indexes
          firebase deploy --only hosting,functions,firestore --token $FIREBASE_TOKEN --project expresvny-navigtor
