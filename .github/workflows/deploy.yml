# GitHub Actions Workflow for deploying the Next.js app to Firebase Hosting

name: Deploy to Firebase

on:
  push:
    branches:
      - main # Workflow sa spustí pri každom push-i do 'main' vetvy

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build the application
        # Firebase API kľúč je potrebný počas build procesu
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: npm run build

      - name: Deploy to Firebase
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_CLI_TOKEN }}
          PROJECT_ID: expresvny-navigtor

# POZNÁMKA PRE POUŽÍVATEĽA:
# Po pridaní tohto súboru do vášho projektu je potrebné nastaviť "Secrets" vo vašom GitHub repozitári.
# Choďte do: Settings > Secrets and variables > Actions a pridajte nasledujúce dve premenné:
#
# 1. Názov: FIREBASE_API_KEY
#    Hodnota: Váš Firebase API kľúč. Nájdete ho v súbore `src/lib/firebase.ts`.
#
# 2. Názov: FIREBASE_CLI_TOKEN
#    Hodnota: Spustite vo vašom lokálnom termináli príkaz `firebase login:ci` (musíte mať nainštalované Firebase CLI).
#             Tento príkaz vám vygeneruje token, ktorý sem vložíte.
#
# Po nastavení týchto premenných bude každá zmena v 'main' vetve automaticky nasadená na Firebase.
